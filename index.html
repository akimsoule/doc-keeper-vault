<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DocManager - Gestionnaire de Documents</title>
    <meta name="description" content="Application moderne de gestion et d'archivage de documents pour entreprises et particuliers. Optimisée pour mobile." />
    <meta name="author" content="Akim Soule" />
    <meta name="theme-color" content="#8b5cf6" />

    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DocManager" />

    <!-- Touch icons -->
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

    <meta property="og:title" content="DocManager - Gestionnaire documentaire" />
    <meta property="og:description" content="Application moderne de gestion et d'archivage de documents. Interface optimisée pour mobile." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://example.com/opengraph-docs.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@akimsoule" />
    <meta name="twitter:image" content="https://example.com/opengraph-docs.png" />

    <!-- Prevent zoom on form inputs on iOS -->
    <style>
      input[type="color"],
      input[type="date"],
      input[type="datetime"],
      input[type="datetime-local"],
      input[type="email"],
      input[type="month"],
      input[type="number"],
      input[type="password"],
      input[type="search"],
      input[type="tel"],
      input[type="text"],
      input[type="time"],
      input[type="url"],
      input[type="week"],
      select:focus,
      textarea {
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
